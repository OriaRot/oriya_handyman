<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <clipPath id="badge"><circle cx="500" cy="500" r="458"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6ECF3"/>
    </radialGradient>
    <style>
      .ol { stroke: #1B1F27; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
      .skin { fill: #F1C09A; }
      .hair { fill: #4A3326; }
      .beard { fill: #9A5B34; }
      .red { fill: #C8102E; }
      .blk { fill: #1F2125; }
      .navy { fill: #1D2F4F; }
      .steel { fill: #C9CFD6; }
      text { font-family: 'Rubik', 'Heebo', sans-serif; }
    </style>
  </defs>

  <!-- badge background -->
  <circle cx="500" cy="500" r="470" fill="#1D2F4F"/>
  <circle cx="500" cy="500" r="458" fill="url(#bg)"/>

  <g clip-path="url(#badge)">
    <!-- tools behind right shoulder -->
    <g transform="translate(735 545) rotate(26)">
      <!-- hammer -->
      <rect class="ol blk" x="-14" y="-150" width="28" height="270" rx="10"/>
      <rect class="ol red" x="-16" y="10" width="32" height="110" rx="12"/>
      <path class="ol steel" d="M -70 -190 L 60 -190 Q 80 -180 70 -160 L -40 -150 L -70 -150 Z"/>
      <rect class="ol" fill="#8E969F" x="-20" y="-195" width="40" height="50" rx="6"/>
    </g>
    <g transform="translate(672 545) rotate(10)">
      <!-- screwdriver -->
      <rect class="ol steel" x="-7" y="-210" width="14" height="140" rx="4"/>
      <path class="ol" fill="#8E969F" d="M -7 -210 L 0 -228 L 7 -210 Z"/>
      <rect class="ol red" x="-20" y="-80" width="40" height="130" rx="16"/>
      <rect class="blk" x="-20" y="-30" width="40" height="22"/>
    </g>
    <g transform="translate(800 575) rotate(42)">
      <!-- pliers -->
      <path class="ol red" d="M -26 -40 L -40 120 Q -38 132 -26 130 L -8 -30 Z"/>
      <path class="ol red" d="M 26 -40 L 40 120 Q 38 132 26 130 L 8 -30 Z"/>
      <path class="ol" fill="#8E969F" d="M -26 -40 L -14 -150 Q 0 -165 14 -150 L 26 -40 Q 0 -20 -26 -40 Z"/>
      <circle class="ol steel" cx="0" cy="-45" r="10"/>
    </g>

    <!-- shirt / body -->
    <path class="ol navy" d="M 170 1000 L 196 700 Q 216 606 390 572 L 610 572 Q 784 606 804 700 L 830 1000 Z"/>
    <!-- neck -->
    <path class="ol skin" d="M 450 470 L 550 470 L 554 580 Q 500 618 446 580 Z"/>
    <path fill="#DFA47D" d="M 452 520 L 548 520 L 550 556 Q 500 580 450 556 Z"/>
    <!-- collar -->
    <path class="ol" fill="none" stroke-width="10" d="M 424 574 Q 500 636 576 574"/>
    <path fill="none" stroke="#2E4670" stroke-width="10" d="M 428 588 Q 500 644 572 588"/>

    <g transform="translate(500 392) scale(1.18) translate(-500 -380)">
    <!-- ears -->
    <ellipse class="ol skin" cx="392" cy="360" rx="24" ry="38"/>
    <ellipse class="ol skin" cx="608" cy="360" rx="24" ry="38"/>
    <path fill="none" stroke="#C98D68" stroke-width="5" d="M 398 340 Q 384 360 398 382"/>
    <path fill="none" stroke="#C98D68" stroke-width="5" d="M 602 340 Q 616 360 602 382"/>

    <!-- face -->
    <path class="ol skin" d="M 400 300 Q 398 230 500 222 Q 602 230 600 300 L 602 400 Q 596 500 500 520 Q 404 500 398 400 Z"/>

    <!-- beard -->
    <path class="ol beard" d="M 400 330 L 402 400 Q 410 488 455 516 Q 500 540 545 516 Q 590 488 598 400 L 600 330 L 590 332 Q 592 410 570 442 Q 535 428 500 430 Q 465 428 430 442 Q 408 410 410 332 Z"/>
    <!-- beard texture -->
    <g fill="none" stroke="#7C4526" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M 425 455 l 6 14"/><path d="M 445 480 l 4 14"/><path d="M 470 495 l 2 14"/>
      <path d="M 530 495 l -2 14"/><path d="M 555 480 l -4 14"/><path d="M 575 455 l -6 14"/>
      <path d="M 500 500 l 0 16"/><path d="M 412 405 l 4 16"/><path d="M 588 405 l -4 16"/>
    </g>

    <!-- mouth (smile) -->
    <path class="ol" fill="#7A2430" d="M 462 450 Q 500 458 538 450 Q 532 486 500 488 Q 468 486 462 450 Z"/>
    <path fill="#FFFFFF" d="M 466 453 Q 500 460 534 453 Q 533 462 530 466 Q 500 471 470 466 Q 467 460 466 453 Z"/>
    <path fill="#E07A7A" d="M 482 480 Q 500 473 518 480 Q 510 487 500 487 Q 490 487 482 480 Z"/>
    <!-- mustache -->
    <path class="ol beard" d="M 438 446 Q 468 420 500 430 Q 532 420 562 446 Q 534 443 500 449 Q 466 443 438 446 Z"/>

    <!-- nose -->
    <path fill="none" stroke="#B9785A" stroke-width="6" stroke-linecap="round" d="M 500 345 Q 494 375 488 392 Q 500 402 514 392"/>

    <!-- eyes -->
    <g>
      <path class="ol" fill="#FFFFFF" d="M 432 352 Q 458 330 484 352 Q 458 366 432 352 Z"/>
      <circle cx="459" cy="350" r="11" fill="#5F8F86"/>
      <circle cx="459" cy="350" r="5" fill="#16191E"/>
      <circle cx="463" cy="346" r="3" fill="#FFFFFF"/>
      <path class="ol" fill="#FFFFFF" d="M 516 352 Q 542 330 568 352 Q 542 366 516 352 Z"/>
      <circle cx="541" cy="350" r="11" fill="#5F8F86"/>
      <circle cx="541" cy="350" r="5" fill="#16191E"/>
      <circle cx="545" cy="346" r="3" fill="#FFFFFF"/>
      <!-- smile lines -->
      <path fill="none" stroke="#C98D68" stroke-width="4" stroke-linecap="round" d="M 428 362 q 6 8 16 10"/>
      <path fill="none" stroke="#C98D68" stroke-width="4" stroke-linecap="round" d="M 572 362 q -6 8 -16 10"/>
    </g>
    <!-- eyebrows -->
    <path class="hair" d="M 424 326 Q 456 302 488 318 L 486 330 Q 456 318 426 336 Z"/>
    <path class="hair" d="M 576 326 Q 544 302 512 318 L 514 330 Q 544 318 574 336 Z"/>

    <!-- hair -->
    <path class="ol hair" d="M 398 340 Q 392 300 402 268 Q 400 220 452 196 Q 474 164 534 168 Q 600 176 612 224 Q 622 252 606 272 Q 610 306 602 340 L 594 340 Q 594 302 584 286 Q 560 268 520 272 Q 470 260 434 276 Q 410 294 408 340 Z"/>
    <g fill="none" stroke="#6B4A37" stroke-width="5" stroke-linecap="round">
      <path d="M 430 238 Q 470 200 530 192"/>
      <path d="M 462 254 Q 520 214 590 222"/>
      <path d="M 420 268 Q 440 240 470 232"/>
    </g>

    <!-- kippah (optional) -->
    <g id="kippah">
      <path class="ol" fill="#FFFFFF" d="M 482 180 Q 534 152 590 182 Q 536 190 482 180 Z"/>
      <path fill="none" stroke="#C9CFD6" stroke-width="3" d="M 498 178 Q 534 164 574 180"/>
    </g>

    </g>
    <!-- raised arm with drill -->
    <path class="navy" d="M 214 640 Q 290 590 392 574 L 300 780 L 186 744 Z"/>
    <path fill="none" stroke="#1B1F27" stroke-width="74" stroke-linecap="round" d="M 236 752 L 262 610"/>
    <path fill="none" stroke="#F1C09A" stroke-width="62" stroke-linecap="round" d="M 236 752 L 262 610"/>

    <g transform="translate(262 548) rotate(28)">
      <!-- battery -->
      <rect class="ol blk" x="-52" y="48" width="118" height="54" rx="10"/>
      <rect class="red" x="-46" y="58" width="106" height="10" rx="3"/>
      <!-- handle -->
      <path class="ol blk" d="M -18 -60 L 42 -60 L 34 52 L -22 52 Z"/>
      <!-- motor body -->
      <rect class="ol red" x="-78" y="-122" width="160" height="70" rx="26"/>
      <rect class="ol blk" x="64" y="-120" width="34" height="66" rx="16"/>
      <path fill="#E8455C" d="M -60 -112 L 50 -112 Q 58 -112 58 -104 L -60 -104 Z"/>
      <!-- vents -->
      <g stroke="#1F2125" stroke-width="5" stroke-linecap="round">
        <path d="M 30 -110 L 30 -66"/><path d="M 42 -110 L 42 -66"/>
      </g>
      <!-- chuck -->
      <rect class="ol" fill="#2B2D31" x="-120" y="-112" width="46" height="50" rx="8"/>
      <rect class="ol steel" x="-132" y="-100" width="16" height="26" rx="4"/>
      <!-- bit -->
      <path class="ol steel" d="M -132 -92 L -196 -92 L -206 -87 L -196 -82 L -132 -82 Z"/>
      <!-- hand -->
      <path class="ol skin" d="M -34 -52 Q -40 -64 -22 -66 L 46 -64 Q 60 -60 56 -44 L 52 20 Q 46 34 30 32 L -24 30 Q -40 26 -38 10 Z"/>
      <g fill="none" stroke="#C98D68" stroke-width="5" stroke-linecap="round">
        <path d="M -30 -32 L 50 -30"/><path d="M -32 -10 L 50 -8"/><path d="M -32 12 L 48 14"/>
      </g>
      <!-- trigger finger -->
      <path class="ol skin" d="M -40 -60 Q -58 -56 -54 -38 Q -50 -26 -34 -30 Z"/>
    </g>

    <!-- banner -->
    <path class="ol" fill="#9C0C24" d="M 140 712 L 220 704 L 220 812 L 140 822 L 168 768 Z"/>
    <path class="ol" fill="#9C0C24" d="M 860 712 L 780 704 L 780 812 L 860 822 L 832 768 Z"/>
    <path class="ol red" d="M 196 690 Q 500 650 804 690 L 804 806 Q 500 766 196 806 Z"/>
    <text x="500" y="776" text-anchor="middle" font-size="112" font-weight="900" fill="#FFFFFF" letter-spacing="2">אוריה</text>

    <!-- sub banner -->
    <path class="ol navy" d="M 286 822 Q 500 796 714 822 L 714 896 Q 500 870 286 896 Z"/>
    <text x="500" y="876" text-anchor="middle" font-size="56" font-weight="700" fill="#FFFFFF" letter-spacing="1">הנדימן</text>
  </g>

  <!-- outer ring -->
  <circle cx="500" cy="500" r="458" fill="none" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="500" cy="500" r="470" fill="none" stroke="#1D2F4F" stroke-width="10"/>
</svg>
